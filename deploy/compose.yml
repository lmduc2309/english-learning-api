name: dsd-english

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/eng.dsdtech.site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - public

  web:
    build:
      context: ../../english-learning-games
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-https://eng.dsdtech.site}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3209
    expose:
      - "3209"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3209/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - public

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 7474
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-dictionary_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
      DB_DATABASE: ${POSTGRES_DB:-english_learning_db}
      TYPEORM_SYNCHRONIZE: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env.production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://eng.dsdtech.site}
      COMMERCIAL_SAFE_MODE: ${COMMERCIAL_SAFE_MODE:-true}
      COMMERCIAL_ALLOW_GENERATED_CONTENT: ${COMMERCIAL_ALLOW_GENERATED_CONTENT:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-false}
      LLM_APP_TITLE: ${LLM_APP_TITLE:-DSD English}
      LLM_HTTP_REFERER: ${PUBLIC_ORIGIN:-https://eng.dsdtech.site}
      TTS_SERVICE_URL: http://tts:8001
      # ── DSD corpus ────────────────────────────────────────────────────────
      # Activation is a two-step deploy on purpose. Ship code with the channel
      # `off` or `internal`, verify the release signature and smoke tests
      # against it, then set `public` in a second deploy. A rollback sets the
      # channel back to `off`; it never falls back to legacy, because there is
      # no fallback path in the code to reach.
      #
      # `public` also refuses a release id that is not public-eligible, and the
      # scale is part of the id — so a pilot cannot be promoted by editing this
      # file.
      DSD_RELEASE_CHANNEL: ${DSD_RELEASE_CHANNEL:-off}
      DSD_ACTIVE_RELEASE_ID: ${DSD_ACTIVE_RELEASE_ID:-}
      DSD_DB_DATABASE: ${DSD_DB_DATABASE:-dsd_corpus_db}
      # One URL per role; no role falls back to another's credential. Only the
      # serving role belongs in the API container.
      DSD_APP_DATABASE_URL: ${DSD_APP_DATABASE_URL:-}
      DSD_AUDIO_PUBLIC_BASE_URL: ${DSD_AUDIO_PUBLIC_BASE_URL:-}
      DSD_REVIEWER_USER_IDS: ${DSD_REVIEWER_USER_IDS:-}
      DSD_BACKUP_PROOF_FILE: /app/data/dsd/runtime/backup-proof.json
      DSD_RESTORE_MAX_AGE_HOURS: ${DSD_RESTORE_MAX_AGE_HOURS:-24}
    expose:
      - "7474"
    volumes:
      - uploads:/app/uploads
      - runtime_evidence:/app/data/dsd/runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7474/serious/dictionary/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - public
      - private

  # One-shot DSD migration process. The privileged URL exists here only and is
  # never copied into the long-running API container.
  dsd-migrator:
    profiles: ["operations"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      COMMERCIAL_SAFE_MODE: "true"
      DSD_RELEASE_CHANNEL: off
      DSD_DB_DATABASE: ${DSD_DB_DATABASE:-dsd_corpus_db}
      DB_DATABASE: ${POSTGRES_DB:-english_learning_db}
      DSD_MIGRATOR_DATABASE_URL: ${DSD_MIGRATOR_DATABASE_URL:?Set DSD_MIGRATOR_DATABASE_URL in deploy/.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    command: ["npm", "run", "dsd:migration:show:prod"]

  # Backup and restore tooling is also one-shot. It has no published port and
  # no restart policy. Dedicated credentials are required by the scripts.
  dsd-ops:
    profiles: ["operations"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: operations
    environment:
      NODE_ENV: production
      DB_DATABASE: ${POSTGRES_DB:-english_learning_db}
      DSD_DB_DATABASE: ${DSD_DB_DATABASE:-dsd_corpus_db}
      LEGACY_BACKUP_DATABASE_URL: ${LEGACY_BACKUP_DATABASE_URL:?Set LEGACY_BACKUP_DATABASE_URL in deploy/.env.production}
      DSD_BACKUP_DATABASE_URL: ${DSD_BACKUP_DATABASE_URL:?Set DSD_BACKUP_DATABASE_URL in deploy/.env.production}
      DSD_RESTORE_DATABASE_URL: ${DSD_RESTORE_DATABASE_URL:?Set DSD_RESTORE_DATABASE_URL in deploy/.env.production}
      DSD_BACKUP_S3_URI: ${DSD_BACKUP_S3_URI:?Set DSD_BACKUP_S3_URI in deploy/.env.production}
      DSD_BACKUP_S3_REGION: ${DSD_BACKUP_S3_REGION:-ap-southeast-1}
      DSD_BACKUP_S3_ENDPOINT: ${DSD_BACKUP_S3_ENDPOINT:-}
      DSD_BACKUP_KMS_KEY_ID: ${DSD_BACKUP_KMS_KEY_ID:?Set DSD_BACKUP_KMS_KEY_ID in deploy/.env.production}
      DSD_BACKUP_RETENTION_DAYS: ${DSD_BACKUP_RETENTION_DAYS:-30}
      DSD_BACKUP_PROOF_FILE: /evidence/backup-proof.json
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - backup_data:/backups
      - runtime_evidence:/evidence
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - public
      - private

  tts:
    build:
      context: ../../tts-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fS", "http://127.0.0.1:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - private

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dictionary_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
      POSTGRES_DB: ${POSTGRES_DB:-english_learning_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-dictionary_user} -d ${POSTGRES_DB:-english_learning_db}"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private

volumes:
  postgres_data:
  redis_data:
  uploads:
  backup_data:
  runtime_evidence:

networks:
  public:
  private:
    internal: true
