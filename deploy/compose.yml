name: dsd-english

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/eng.dsdtech.site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - public

  web:
    build:
      context: ../../english-learning-games
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-https://eng.dsdtech.site}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3209
    expose:
      - "3209"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3209/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - public

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 7474
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-dictionary_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
      DB_DATABASE: ${POSTGRES_DB:-english_learning_db}
      TYPEORM_SYNCHRONIZE: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env.production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://eng.dsdtech.site}
      DICTIONARY_DATA_SOURCE: ${DICTIONARY_DATA_SOURCE:-primary}
      DICTIONARY_ALLOW_GENERATED_FALLBACK: ${DICTIONARY_ALLOW_GENERATED_FALLBACK:-false}
      DICTIONARY_ALLOW_EXTERNAL_FALLBACK: ${DICTIONARY_ALLOW_EXTERNAL_FALLBACK:-false}
      DICTIONARY_VI_SEARCH: ${DICTIONARY_VI_SEARCH:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-false}
      LLM_APP_TITLE: ${LLM_APP_TITLE:-DSD English}
      LLM_HTTP_REFERER: ${PUBLIC_ORIGIN:-https://eng.dsdtech.site}
      TTS_SERVICE_URL: http://tts:8001
    expose:
      - "7474"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7474/serious/dictionary/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - public
      - private

  tts:
    build:
      context: ../../tts-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fS", "http://127.0.0.1:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - private

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dictionary_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
      POSTGRES_DB: ${POSTGRES_DB:-english_learning_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-dictionary_user} -d ${POSTGRES_DB:-english_learning_db}"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  public:
  private:
    internal: true
