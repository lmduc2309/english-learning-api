name: Deploy DSD English to VPS

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation to run
        required: true
        default: backup-only
        type: choice
        options:
          - backup-only
          - deploy

concurrency:
  group: dsd-english-production
  cancel-in-progress: false

jobs:
  backup-only:
    name: Back up the primary production database
    if: inputs.operation == 'backup-only'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Create and verify a production database dump
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 45m
          script: |
            set -eu
            umask 077

            ROOT=/var/www/sites/dsd-english
            API_DIR="$ROOT/english-learning-api"
            COMPOSE_FILE="$API_DIR/deploy/compose.yml"
            ENV_FILE="$API_DIR/deploy/.env.production"
            BACKUP_DIR="$ROOT/backups/manual"

            test -d "$API_DIR/.git"
            test -f "$COMPOSE_FILE"
            test -f "$ENV_FILE"
            cd "$API_DIR"

            COMPOSE="docker compose --env-file $ENV_FILE -f $COMPOSE_FILE"
            $COMPOSE config --quiet
            POSTGRES_CONTAINER="$($COMPOSE ps -q postgres)"
            test -n "$POSTGRES_CONTAINER"
            DATABASE="$(docker exec "$POSTGRES_CONTAINER" printenv POSTGRES_DB)"
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"

            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            PARTIAL="$BACKUP_DIR/${DATABASE}-${STAMP}.dump.partial"
            DUMP="$BACKUP_DIR/${DATABASE}-${STAMP}.dump"
            docker exec "$POSTGRES_CONTAINER" sh -c \
              'exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom --no-owner --no-privileges' \
              > "$PARTIAL"
            test -s "$PARTIAL"
            docker exec -i "$POSTGRES_CONTAINER" pg_restore --list < "$PARTIAL" > /dev/null
            mv "$PARTIAL" "$DUMP"
            chmod 600 "$DUMP"
            sha256sum "$DUMP" > "$DUMP.sha256"
            chmod 600 "$DUMP.sha256"
            echo "Verified primary database dump: $DUMP"

  validate-api:
    name: Validate API
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out API
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test -- --runInBand --watchman=false

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build API
        run: npm run build

  deploy:
    name: Deploy primary dictionary stack
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    needs: validate-api
    environment: production
    steps:
      - name: Deploy through the existing VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 45m
          script: |
            set -eu
            umask 077

            ROOT=/var/www/sites/dsd-english
            API_DIR="$ROOT/english-learning-api"
            WEB_DIR="$ROOT/english-learning-games"
            TTS_DIR="$ROOT/tts-service"
            COMPOSE_FILE="$API_DIR/deploy/compose.yml"
            ENV_FILE="$API_DIR/deploy/.env.production"
            BACKUP_DIR="$ROOT/backups/pre-deploy"

            for repo_dir in "$API_DIR" "$WEB_DIR" "$TTS_DIR"; do
              test -d "$repo_dir/.git"
              test -z "$(git -C "$repo_dir" status --porcelain)"
            done
            test -f "$ENV_FILE"

            git -C "$API_DIR" pull --ff-only origin main
            git -C "$WEB_DIR" pull --ff-only origin main
            git -C "$TTS_DIR" pull --ff-only origin main

            cd "$API_DIR"
            COMPOSE="docker compose --env-file $ENV_FILE -f $COMPOSE_FILE"
            $COMPOSE config --quiet
            $COMPOSE build
            $COMPOSE up -d postgres redis
            $COMPOSE run --rm api npm run migration:show:prod

            POSTGRES_CONTAINER="$($COMPOSE ps -q postgres)"
            DATABASE="$(docker exec "$POSTGRES_CONTAINER" printenv POSTGRES_DB)"
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            PARTIAL="$BACKUP_DIR/${DATABASE}-${STAMP}.dump.partial"
            DUMP="$BACKUP_DIR/${DATABASE}-${STAMP}.dump"
            docker exec "$POSTGRES_CONTAINER" sh -c \
              'exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom --no-owner --no-privileges' \
              > "$PARTIAL"
            test -s "$PARTIAL"
            docker exec -i "$POSTGRES_CONTAINER" pg_restore --list < "$PARTIAL" > /dev/null
            mv "$PARTIAL" "$DUMP"
            chmod 600 "$DUMP"
            sha256sum "$DUMP" > "$DUMP.sha256"

            $COMPOSE run --rm api npm run migration:run:prod
            $COMPOSE run --rm api npm run migration:show:prod
            $COMPOSE up -d

            curl -fS -H 'Host: eng.dsdtech.site' http://127.0.0.1/healthz
            curl -fS -H 'Host: eng.dsdtech.site' http://127.0.0.1/
            curl -fSG -H 'Host: eng.dsdtech.site' \
              --data-urlencode 'q=học' \
              --data-urlencode 'direction=vi-en' \
              --data-urlencode 'limit=5' \
              http://127.0.0.1/serious/dictionary/search
