name: Deploy DSD English to VPS

on:
  workflow_dispatch:

concurrency:
  group: dsd-english-production
  cancel-in-progress: false

jobs:
  validate-api:
    name: Validate API
    runs-on: ubuntu-latest

    steps:
      - name: Check out API
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test -- --runInBand --watchman=false

      - name: Build API
        run: npm run build

  deploy:
    name: Deploy production stack
    runs-on: ubuntu-latest
    needs: validate-api
    environment: production

    steps:
      - name: Deploy through the existing VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -eu

            ROOT=/var/www/sites/dsd-english
            API_DIR="$ROOT/english-learning-api"
            WEB_DIR="$ROOT/english-learning-games"
            TTS_DIR="$ROOT/tts-service"
            COMPOSE_FILE="$API_DIR/deploy/compose.yml"
            ENV_FILE="$API_DIR/deploy/.env.production"
            BACKUP_DIR="$ROOT/backups/postgres"

            for repo_dir in "$API_DIR" "$WEB_DIR" "$TTS_DIR"; do
              if [ ! -d "$repo_dir/.git" ]; then
                echo "Missing provisioned repository: $repo_dir"
                exit 1
              fi
            done

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing production environment: $ENV_FILE"
              exit 1
            fi

            git -C "$API_DIR" pull --ff-only origin main
            git -C "$WEB_DIR" pull --ff-only origin main
            git -C "$TTS_DIR" pull --ff-only origin main

            cd "$API_DIR"
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" config --quiet

            mkdir -p "$BACKUP_DIR"
            if docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps --status running --services | grep -qx postgres; then
              BACKUP_SQL="$BACKUP_DIR/english-learning-$(date -u +%Y%m%dT%H%M%SZ).sql"
              docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" exec -T postgres \
                sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$BACKUP_SQL"
              test -s "$BACKUP_SQL"
              gzip "$BACKUP_SQL"
              BACKUP_FILE="$BACKUP_SQL.gz"
              gzip -t "$BACKUP_FILE"
              echo "Verified PostgreSQL backup: $BACKUP_FILE"
            else
              echo "PostgreSQL is not running yet; treating this as a first deployment."
            fi

            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" build
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d postgres redis
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" run --rm api npm run migration:show:prod
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" run --rm api npm run migration:run:prod
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" run --rm api npm run migration:show:prod
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d

            curl -fS -H 'Host: eng.dsdtech.site' http://127.0.0.1/healthz
            curl -fS -H 'Host: eng.dsdtech.site' http://127.0.0.1/
            curl -fSG -H 'Host: eng.dsdtech.site' \
              --data-urlencode 'q=học' \
              --data-urlencode 'direction=vi-en' \
              --data-urlencode 'limit=5' \
              http://127.0.0.1/serious/dictionary/search
